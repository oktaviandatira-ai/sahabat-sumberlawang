<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAHABAT — SD Aisyiyah Unggulan Sumberlawang</title>

  <!-- External Libraries & Fonts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Fraunces:wght@700&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --deep: #103b39;
      --teal: #087b75;
      --pale: #edf7f3;
      --cream: #f7f4eb;
      --ink: #163e3a;
      --muted: #66827d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 3px solid #e6a73d !important;
      outline-offset: 2px;
    }

    .access {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background: linear-gradient(115deg, #123d3b, #297c76 72%, #408f88);
      color: white;
      padding: clamp(22px, 5vw, 56px);
    }

    .access-inner {
      max-width: 1160px;
      margin: auto;
      min-height: calc(88 * min(var(--vh, 1vh), 1vh));
      display: flex;
      flex-direction: column;
    }

    .access-logo {
      width: 200px;
      max-width: 55%;
      height: 68px;
      object-fit: contain;
      object-position: left center;
    }

    .access h1 {
      font-family: Fraunces, serif;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.05;
      margin: 14px 0;
    }

    .access-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: auto;
      margin-bottom: 30px;
    }

    .access-card {
      background: #fff;
      color: var(--ink);
      padding: 25px 21px 18px;
      border-radius: 13px;
      min-height: 245px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px #002f2b20;
    }

    .access-card .role-icon {
      color: var(--teal);
      margin-bottom: 15px;
    }

    .access-card h2 {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .access-card p {
      font-size: 13px;
      color: #657d79;
      line-height: 1.45;
    }

    .solid {
      background: var(--teal);
      color: white;
      border-radius: 8px;
      padding: 10px 17px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .02em;
    }

    .access-card .solid {
      width: 100%;
      margin-top: auto;
    }

    .solid:hover {
      background: #075d59;
    }

    .login-page {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--cream);
    }

    .login-photo {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      background: #174f4d;
    }

    .login-photo img.photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .login-photo:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #073f3bc9, #267c75a8);
    }

    .login-photo-content {
      position: absolute;
      z-index: 1;
      inset: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: white;
    }

    .login-photo-content img {
      width: 190px;
      height: 75px;
      object-fit: contain;
      object-position: left center;
    }

    .login-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .login-box {
      width: min(100%, 390px);
    }

    .login-box h1 {
      font-size: 30px;
      font-weight: 800;
      margin: 18px 0 4px;
    }

    .login-card,
    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px #103b390b;
      border: 1px solid #e4eeea;
    }

    .login-card {
      padding: 23px;
      margin-top: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea,
    .filter-control {
      width: 100%;
      border: 1px solid #d5e4df;
      border-radius: 7px;
      background: white;
      padding: 9px 11px;
      color: var(--ink);
      min-height: 38px;
    }

    .field textarea {
      min-height: 80px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .app-shell {
      display: flex;
      height: calc(100 * min(var(--vh, 1vh), 1vh));
      width: 100%;
      background: var(--pale);
      overflow: hidden;
    }

    .sidebar {
      width: 238px;
      flex: none;
      background: var(--deep);
      color: #effcf8;
      padding: 20px 13px;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow-y: auto;
      z-index: 20;
    }

    .side-logo {
      width: 145px;
      height: 56px;
      object-fit: contain;
      object-position: left;
    }

    .side-title {
      font-family: Fraunces, serif;
      font-size: 19px;
      margin: 7px 9px 0;
    }

    .side-caption {
      font-size: 10px;
      color: #92c7bd;
      margin: 0 9px 22px;
    }

    .nav-group {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      color: #83b9ae;
      margin: 15px 10px 7px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      padding: 10px 11px;
      color: #e0f4ef;
      border-radius: 7px;
      font-size: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-item:hover,
    .nav-item.active {
      background: #205c58;
      color: #fff;
    }

    .sidebar-bottom {
      margin-top: auto;
      border-top: 1px solid #3b6c65;
      padding-top: 10px;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      margin-left: 238px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      background: white;
      padding: 12px clamp(15px, 2vw, 30px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 66px;
      flex: none;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar strong {
      font-size: 13px;
    }

    .content {
      padding: 20px clamp(15px, 2vw, 30px) 35px;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .demo-banner {
      background: #fffbea;
      border: 1px solid #f5df93;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 21px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .14em;
      font-weight: 800;
      color: #07857a;
      text-transform: uppercase;
    }

    .page-title {
      font-size: clamp(22px, 2.5vw, 29px);
      font-weight: 800;
      margin: 2px 0 3px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
      margin: 19px 0;
    }

    .stat {
      padding: 18px;
      min-height: 104px;
    }

    .stat strong {
      font-size: 28px;
      display: block;
      margin: 7px 0 0;
    }

    .stat small {
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card {
      padding: 19px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .toolbar {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      align-items: center;
      margin: 16px 0;
    }

    .toolbar .filter-control {
      width: auto;
      max-width: 100%;
    }

    .table-wrap {
      overflow: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 610px;
      font-size: 12px;
    }

    .data-table th {
      background: #f0f8f5;
      color: #36736c;
      text-align: left;
      font-size: 10px;
      letter-spacing: .06em;
    }

    .data-table th,
    .data-table td {
      padding: 11px;
      border-bottom: 1px solid #edf2ef;
      vertical-align: middle;
    }

    .data-table tr:hover td {
      background: #f8fcfa;
    }

    .small-btn {
      border: 1px solid #cfe1db;
      background: white;
      color: #087b75;
      border-radius: 7px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 11px;
    }

    .small-btn:hover {
      background: #eef8f4;
    }

    .danger {
      color: #ae4640;
    }

    .pill {
      display: inline-block;
      border-radius: 99px;
      background: #e3f8ed;
      color: #168366;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill.off {
      background: #eee;
      color: #68736e;
    }

    .notice {
      padding: 11px 14px;
      border-radius: 8px;
      background: #dff7e9;
      color: #075b47;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .notice.error {
      background: #ffe9e5;
      color: #a02e2e;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .badge-card {
      text-align: center;
      background: #f6faf7;
      border: 1px solid #cde3da;
      border-radius: 12px;
      padding: 14px 7px;
      min-height: 145px;
    }

    .badge-card.locked {
      filter: grayscale(1);
      opacity: .55;
    }

    .badge-medal {
      font-size: 36px;
      display: block;
      margin-bottom: 7px;
    }

    .chart-holder {
      height: 240px;
      position: relative;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .full {
      grid-column: 1/-1;
    }

    /* Operator desktop dashboard */
    .operator-dashboard {
      padding-top: 12px;
      padding-bottom: 16px;
      overflow: hidden;
    }

    .operator-dashboard .demo-banner {
      margin-bottom: 10px;
      padding: 8px 12px;
    }

    .operator-dashboard .page-title {
      margin: 0 0 2px;
    }

    .operator-dashboard .operator-filters {
      margin-top: 10px;
      padding: 10px 14px;
    }

    .operator-dashboard .toolbar {
      margin: 8px 0 0;
      gap: 7px;
    }

    .operator-dashboard .field {
      gap: 3px;
    }

    .operator-dashboard .field input,
    .operator-dashboard .field select,
    .operator-dashboard .filter-control {
      padding: 6px 9px;
      min-height: 31px;
    }

    .operator-dashboard .stats {
      gap: 8px;
      margin: 10px 0;
    }

    .operator-dashboard .stat {
      padding: 9px 12px;
      min-height: 62px;
    }

    .operator-dashboard .stat strong {
      font-size: 20px;
      margin: 3px 0 0;
    }

    .operator-dashboard .card {
      padding: 12px;
      border-radius: 11px;
    }

    .operator-dashboard .card h2 {
      font-size: 13px;
      margin-bottom: 7px;
    }

    .operator-dashboard .card.mt-4 {
      margin-top: 10px;
    }

    .operator-dashboard .chart-holder {
      height: 112px;
    }

    .operator-dashboard .grid-2 {
      gap: 8px;
    }

    .operator-dashboard .data-table {
      font-size: 11px;
      min-width: 0;
    }

    .operator-dashboard .data-table th,
    .operator-dashboard .data-table td {
      padding: 6px 8px;
    }

    .operator-dashboard .grid-2.mt-4 {
      margin-top: 10px;
    }

    .operator-dashboard .table-wrap {
      max-height: 92px;
      overflow: auto;
    }

    .operator-dashboard .table-wrap+.chart-holder {
      height: 82px;
    }

    .operator-dashboard .operator-filters .toolbar .field {
      flex: 1 1 130px;
    }

    .operator-dashboard .operator-filters .small-btn {
      align-self: end;
    }

    @media (min-width: 951px) {
      .operator-dashboard {
        height: calc(100 * min(var(--vh, 1vh), 1vh) - 66px);
        min-height: 0;
      }

      .operator-dashboard .content {
        padding-top: 12px;
      }

      .operator-dashboard .grid-2.mt-4 .card {
        min-height: 154px;
      }

      .operator-dashboard .grid-2.mt-4 .chart-holder {
        height: 92px;
      }

      .operator-dashboard .card:has(#home-donut) {
        min-height: 126px;
      }

      .operator-dashboard .card:has(#home-donut) .chart-holder {
        height: 86px;
      }
    }

    @media (max-width: 950px) {
      .operator-dashboard {
        overflow: visible;
      }

      .operator-dashboard .chart-holder {
        height: 180px;
      }
    }

    @media (max-width: 690px) {
      .operator-dashboard .chart-holder,
      .operator-dashboard .grid-2.mt-4 .chart-holder {
        height: 210px;
      }

      .operator-dashboard .stat {
        min-height: 72px;
      }
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #edf3ef;
      font-size: 13px;
    }

    .check-row select {
      max-width: 180px;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      background: #f0f8f5;
      margin: 9px 0;
      font-size: 12px;
    }

    .message.mine {
      background: #e2f3ee;
      margin-left: 12%;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #092c2abb;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 17px;
    }

    .modal {
      background: white;
      border-radius: 15px;
      padding: 22px;
      width: min(100%, 620px);
      max-height: 90%;
      overflow: auto;
    }

    #toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 80;
      max-width: 350px;
    }

    .mobile-menu {
      display: none;
    }

    .backdrop {
      display: none;
    }

    @media (max-width: 950px) {
      .workspace {
        margin-left: 0;
      }

      .sidebar {
        position: fixed;
        left: 0;
        transform: translateX(-100%);
        transition: transform .25s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .backdrop.open {
        display: block;
        position: fixed;
        inset: 0;
        background: #072b2a88;
        z-index: 19;
      }

      .mobile-menu {
        display: inline-flex;
      }

      .badge-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 690px) {
      .access-cards,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .access-cards {
        margin-top: 35px;
      }

      .access-card {
        min-height: 185px;
      }

      .login-page {
        grid-template-columns: 1fr;
      }

      .login-photo {
        min-height: 260px;
      }

      .login-right {
        padding: 35px 20px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .badge-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .topbar {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body class="w-full" style="background: rgb(237, 247, 243);">
  <div id="app" class="w-full"></div>

  <!-- Validation & Template Placeholders -->
  <div id="template-validation" hidden aria-hidden="true">
    <span data-template-id="access-title" style="color: #fff; font-weight: 700; font-size: 14px;">SAHABAT</span>
    <span data-template-id="access-subtitle" style="color: #fff; font-weight: 700; font-size: 14px;">Sinergi Orang Tua dan Sekolah Pembentuk Anak Hebat</span>
    <span data-template-id="access-description" style="color: #fff; font-weight: 400; font-size: 14px;">Bersinergi dalam pembiasaan, berkolaborasi dalam pendidikan, membentuk anak hebat.</span>
    <span data-template-id="login-title" style="color: rgb(16, 59, 57); font-weight: 800; font-size: 14px;">Masuk SAHABAT</span>
    <span data-template-id="login-description" style="color: rgb(102, 130, 125); font-weight: 400; font-size: 14px;">Pilih profil aktif untuk melanjutkan ke dashboard sesuai hak akses demo.</span>
    <img data-template-id="login-photo" loading="lazy" src="https://images.pexels.com/photos/8613089/pexels-photo-8613089.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1280" alt="Anak-anak belajar bersama">
    <img data-template-id="school-logo" loading="lazy" src="https://via.placeholder.com/150x50?text=Logo+SD" alt="Logo SD Aisyiyah Unggulan Sumberlawang">
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <template id="branding">
    <img data-template-id="school-logo" loading="lazy" class="access-logo" alt="Logo">
  </template>

 <script>
    // --- KONFIGURASI GOOGLE APPS SCRIPT ---
    const API_URL = "https://script.google.com/macros/s/AKfycbw2EnyxElKmMq3w8FnUyEIk7AhTCbdzsPVpZ8W4Y6ECeWUUVywP6eGsUk68x4bSVBmS/exec";

    // 1. Fungsi Memuat SELURUH ENTITAS dari Google Spreadsheet
    async function loadDataFromSpreadsheet() {
      if (!API_URL || API_URL.includes("MASUKKAN")) return; 
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        if(result && result.status === 'success' && result.data) {
          const d = result.data;

          // Sinkronisasi Entitas Utama jika Spreadsheet memiliki isi
          if (d.students && d.students.length) {
            db.students = d.students.map(r => ({ id: String(r[0]), nis: String(r[1]), nisn: String(r[2]), name: String(r[3]), gender: String(r[4]), classId: String(r[5]), active: r[6] !== false }));
          }
          if (d.teachers && d.teachers.length) {
            db.teachers = d.teachers.map(r => ({ id: String(r[0]), name: String(r[1]), nip: String(r[2]), role: String(r[3]), classId: String(r[4]), username: String(r[5]), active: r[6] !== false }));
          }
          if (d.parents && d.parents.length) {
            db.parents = d.parents.map(r => ({ id: String(r[0]), name: String(r[1]), role: String(r[2]), username: String(r[3]), active: r[4] !== false }));
          }
          if (d.classes && d.classes.length) {
            db.classes = d.classes.map(r => ({ id: String(r[0]), name: String(r[1]), teacherId: String(r[2]), active: r[3] !== false }));
          }
          if (d.links && d.links.length) {
            db.links = d.links.map(r => ({ id: String(r[0]), parentId: String(r[1]), studentId: String(r[2]) }));
          }

          // Sinkronisasi Pengaturan Sistem
          if (d.years && d.years.length) {
            db.years = d.years.map(r => ({ id: String(r[0]), name: String(r[1]), active: Boolean(r[2]) }));
          }
          if (d.periods && d.periods.length) {
            db.periods = d.periods.map(r => ({ id: String(r[0]), name: String(r[1]), yearId: String(r[2]), active: Boolean(r[3]) }));
          }

          // Sinkronisasi Entitas Transaksional
          if (d.schoolHabits && d.schoolHabits.length) {
            db.schoolHabits = d.schoolHabits.map(r => ({ id: String(r[0]), studentId: String(r[1]), periodId: String(r[2]), date: String(r[3]), activity: String(r[4]), status: String(r[5]), note: String(r[6]), verified: Boolean(r[7]) }));
          }
          if (d.homeHabits && d.homeHabits.length) {
            db.homeHabits = d.homeHabits.map(r => ({ id: String(r[0]), studentId: String(r[1]), periodId: String(r[2]), date: String(r[3]), activity: String(r[4]), status: String(r[5]), note: String(r[6]), verified: Boolean(r[7]) }));
          }
          if (d.assessments && d.assessments.length) {
            db.assessments = d.assessments.map(r => ({ id: String(r[0]), studentId: String(r[1]), periodId: String(r[2]), date: String(r[3]), scores: [Number(r[4]), Number(r[5]), Number(r[6])], note: String(r[7]), follow: String(r[8]) }));
          }
          if (d.exp && d.exp.length) {

      const match = r => ids.includes(r.studentId) && periodIds.includes(r.periodId);

    function completionBlock(a) {
      const done = x => x.filter(h => h.status === 'Terlaksana').length;
      const rows = [
        [a.school, 'Pembiasaan Sekolah'],
        [a.home, 'Pembiasaan Rumah']
      ];
      const total = rows.reduce((n, [x]) => n + x.length, 0),
        finished = rows.reduce((n, [x]) => n + done(x), 0);

      if (!total) return `<section class="card mt-4"><h2>Catatan Penyelesaian Pembiasaan</h2><p class="hint">Belum tersedia data pada filter yang dipilih.</p></section>`;

      const pct = Math.round(finished / total * 100);
      return `<section class="card mt-4">
        <h2>Catatan Penyelesaian Pembiasaan</h2>
        <div class="stats">
          <div class="stat"><strong>${total}</strong><small>Aktivitas direncanakan</small></div>

        <p class="hint">${pct >= 80 ? 'Capaian pembiasaan sudah baik dan konsisten.' : 'Masih ada kendala penyelesaian yang perlu ditindaklanjuti bersama.'}</p>

            <h2>Grafik Nilai Karakter Siswa</h2>

    function homeDashboard() {
      if (role === 'operator') return operatorDashboard();

          `<div class="grid-2 mt-4">
            <section class="card">
              <div class="eyebrow">IDENTITAS GURU</div>
              <h2>${esc(actor.name)}</h2>
              <p class="hint">${esc(actor.role)} · ${esc(db.classes.find(c => c.id === actor.classId)?.name || '')} · Tahun ajaran ${esc(db.years.find(y => y.active)?.name || '—')} · ${esc(activePeriod()?.name || '—')}</p>

            <section class="card">
              <div class="eyebrow">ANAK/SISWA YANG DIDAMPINGI</div>
              <h2>Daftar Siswa · ${teacherIds().length} siswa</h2>

        `<div class="grid-2 mb-4">
          <section class="card">
            <div class="eyebrow">ANANDA HEBAT</div>

        stats(s?.id) +

    function levelProgress(id) {
      const p = points(id),
        i = Math.max(0, levels.findLastIndex(l => p >= l[1])),
        next = levels[i + 1];

      return `<strong>${levels[i][2]} ${levels[i][0]}</strong>
        <div class="w-full h-2 rounded-full bg-emerald-100 my-3">
          <div class="h-full rounded-full bg-emerald-500" style="width:${next ? Math.min(100, (p - levels[i][1]) / (next[1] - levels[i][1]) * 100) : 100}%"></div>
        </div>
        <p class="hint">${next ? `${p} EXP · ${next[1] - p} EXP lagi menuju ${next[0]}` : `${p} EXP · Level tertinggi tercapai`}</p>`;
    }

    function badges(id) {
      const p = points(id);
      return `<section class="card my-4">
        <h2>Digital Badge & Reward</h2>
        <div class="badge-grid">
          ${levels.map(([name, min, icon]) => `
            <div class="badge-card ${p < min ? 'locked' : ''}">
              <span class="badge-medal" aria-hidden="true">${icon}</span>
              <strong class="text-xs">${name}</strong>
              <div class="hint">${min} EXP minimum</div>
              <span class="pill ${p < min ? 'off' : ''}">${p >= min ? 'Terbuka' : 'Terkunci'}</span>
            </div>
          `).join('')}
        </div>
        <h2 class="mt-5">Riwayat Poin</h2>
        ${db.exp.filter(e => e.studentId === id).slice().reverse().slice(0, 8).map(e => `
          <div class="check-row">
            <span>${esc(e.activity)} · ${esc(e.date)}</span>
            <strong>+${e.amount}</strong>
          </div>
        `).join('') || '<p class="hint">Belum ada EXP terverifikasi.</p>'}
      </section>`;
    }

    const entityMap = {
      'Data Siswa': 'students',
      'Data Guru': 'teachers',
      'Data Orang Tua/Wali': 'parents',
      'Data Kelas': 'classes',
      'Relasi Keluarga': 'links'

    function entityName(type, row) {
      return type === 'links' ? `${db.students.find(s => s.id === row.studentId)?.name || '—'} ↔ ${db.parents.find(p => p.id === row.parentId)?.name || '—'}` : row.name;
    }

    function entityTable(type) {
      const labels = { students: 'Siswa', teachers: 'Guru', parents: 'Orang Tua/Wali', classes: 'Kelas', links: 'Relasi Keluarga' },
        title = 'Data ' + labels[type];
      let rows = db[type]
        .filter(r => !filters.search || entityName(type, r).toLowerCase().includes(filters.search.toLowerCase()))
        .filter(r => !filters.status || String(r.active) !== String(filters.status === 'off'))
        .filter(r => !filters.classId || r.classId === filters.classId);

      return heading('DATA CENTER', title, 'Kelola data terpusat yang terhubung di seluruh aplikasi.', btn('+ Tambah Data', 'add:' + type, 'solid')) +
        `<div class="card mt-4">
          <div class="toolbar">
            <label class="sr-only" for="search-entity">Cari nama atau identitas</label>
            <input id="search-entity" class="filter-control flex-1" placeholder="Cari nama atau identitas..." value="${esc(filters.search || '')}">
            <label class="sr-only" for="status-filter">Status</label>
            <select id="status-filter" class="filter-control">${options([['', 'Semua Status'], ['on', 'Aktif'], ['off', 'Tidak Aktif']], filters.status || '')}</select>
            ${type === 'students' || type === 'teachers' ? `
              <label class="sr-only" for="class-filter">Kelas</label>
              <select id="class-filter" class="filter-control">${options([['', 'Semua Kelas'], ...db.classes.map(c => [c.id, c.name])], filters.classId || '')}</select>

          <div class="table-wrap">

                <tr><th>NAMA / RELASI</th><th>INFORMASI</th><th>STATUS</th><th>TINDAKAN</th></tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td><strong>${esc(entityName(type, r))}</strong></td>
                    <td>${esc(type === 'students' ? `${r.nis} · ${db.classes.find(c => c.id === r.classId)?.name || 'Tanpa kelas'}` : type === 'teachers' ? `${db.classes.find(c => c.id === r.classId)?.name || '—'} · ${r.role} · ${r.username}` : type === 'parents' ? r.role : type === 'classes' ? 'Wali: ' + (db.teachers.find(t => t.id === r.teacherId)?.name || '—') : 'Orang tua ↔ siswa')}</td>
                    <td><span class="pill ${r.active === false ? 'off' : ''}">${r.active === false ? 'Tidak Aktif' : 'Aktif'}</span></td>
                    <td class="whitespace-nowrap">
                      ${btn('Detail', `detail:${type}:${r.id}`)} 
                      ${btn('Edit', `edit:${type}:${r.id}`)} 
                      ${type !== 'links' ? btn(r.active === false ? 'Aktifkan' : 'Nonaktifkan', `toggle:${type}:${r.id}`) : ''} 
                      ${btn('Hapus', `delete:${type}:${r.id}`, 'small-btn danger')}
                    </td>
                  </tr>
                `).join('') || '<tr><td colspan="4">Tidak ada data untuk filter ini.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function periodPage() {
      return heading('DATA CENTER', 'Tahun Ajaran & Periode', 'Satu periode utama aktif; arsip lama tetap terlihat.', btn('+ Tambah Tahun', 'add:years', 'small-btn') + ' ' + btn('+ Tambah Periode', 'add:periods', 'solid')) +
        `<div class="grid-2 mt-4">
          <section class="card">
            <h2>Tahun Ajaran</h2>
            ${db.years.map(y => `<div class="check-row"><strong>${esc(y.name)}</strong><span class="pill ${y.active ? '' : 'off'}">${y.active ? 'Aktif' : 'Arsip'}</span></div>`).join('')}
          </section>
          <section class="card">
            <h2>Periode · ${esc(periodLabel())}</h2>
            ${db.periods.map(p => `
              <div class="check-row">
                <span>${esc(db.years.find(y => y.id === p.yearId)?.name)} / ${esc(p.name)} <span class="pill ${p.active ? '' : 'off'}">${p.active ? 'Aktif' : 'Tidak Aktif'}</span></span>
                ${!p.active ? btn('Jadikan Aktif', 'activate:' + p.id) : ''}
              </div>
            `).join('')}
          </section>
        </div>`;
    }

    function habitPage(kind) {
      const school = kind === 'school',
        ids = availableIds(),
        s = currentChild();

      return heading(school ? 'PEMBINAAN SEKOLAH' : 'PEMBIASAAN RUMAH', school ? 'School Habit Check' : 'Habit Tracker Rumah', `Periode aktif: ${periodLabel()}. ${school ? 'EXP diberikan setelah guru memverifikasi.' : 'Catatan tersimpan dan dapat diverifikasi guru.'}`) +
        `<section class="card mt-4">

            <div class="form-grid">
              <div class="field">
                <label for="habit-student">Nama anak</label>

                <select id="habit-${i}" name="a${i}" class="filter-control" aria-label="Status ${esc(name)}">
                  <option value="Belum Terlaksana">Belum Terlaksana</option>

    function habitHistory(kind) {
      let data = (kind === 'school' ? db.schoolHabits : db.homeHabits).filter(h => availableIds().includes(h.studentId));

              <tr>
                <td>${esc(h.date)}<br>${esc(db.students.find(s => s.id === h.studentId)?.name)}</td>

                <td>${h.verified ? '<span class="pill">Terverifikasi</span>' : role === 'guru' ? btn('Verifikasi', `verify:${kind}:${h.id}`) : '<span class="pill off">Menunggu guru</span>'}</td>

              <textarea id="assess-note" name="note"></textarea>

            </div>
          `).join('') || '<p class="hint">Belum ada penilaian.</p>'}
        </section>`;
    }

    function messagesPage() {
      const s = currentChild(),
        ids = availableIds();
      let msgs = db.messages.filter(m => m.studentId === selectedStudent && (role === 'guru' ? m.teacherId === actor.id : role === 'parent' ? m.parentId === actor.id : true));
      const linkedParents = db.links.filter(l => l.studentId === selectedStudent).map(l => db.parents.find(p => p.id === l.parentId)).filter(Boolean);

      return heading('KOMUNIKASI PRIVAT', view, 'Percakapan dua arah antara guru dan orang tua yang terhubung.') +
        `<section class="card mt-4">
          <div class="field">
            <label for="message-child">Pilih siswa</label>
            <select id="message-child">${studentOptions(ids)}</select>
          </div>
          <div class="mt-4 max-h-72 overflow-auto" aria-live="polite">
            ${msgs.map(m => `
              <div class="message ${m.senderId === actor.id ? 'mine' : ''}">
                <strong>${esc(m.senderName)}</strong> · ${esc(m.date)}
                <p class="mt-1">${esc(m.text)}</p>
              </div>
            `).join('') || '<p class="hint">Belum ada percakapan untuk anak ini.</p>'}
          </div>
          <form id="message-form" class="form-grid mt-4">
            ${role === 'guru' ? `
              <div class="field">
                <label for="message-recipient">Penerima orang tua</label>

        `<div class="card mt-4">
          <div class="toolbar">
            <label class="field">Tahun ajaran<select id="analytics-year">${options([['', 'Semua Tahun'], ...db.years.map(y => [y.id, y.name])], filters.year || '')}</select></label>
            <label class="field">Periode<select id="analytics-period">${options([['', 'Semua Periode'], ...db.periods.map(p => [p.id, p.name])], filters.period || '')}</select></label>
            <label class="field">Kelas<select id="analytics-class">${options([['', 'Semua Kelas'], ...db.classes.map(c => [c.id, c.name])], filters.analyticsClass || '')}</select></label>
            <label class="field">Nama anak<select id="analytics-student">${options([['', 'Semua Anak'], ...db.students.map(s => [s.id, s.name])], filters.analyticsStudent || '')}</select></label>
          </div>
          <div id="analytics-summary"></div>
        </div>
        <div class="mt-4">${chartCards()}</div>
        <div class="card mt-4">
          <h2>Rekap karakter, kehadiran, sekolah, rumah dan EXP</h2>
          <div id="analytics-details"></div>
        </div>`;
    }

    function auditPreview() {
      return db.audit.slice(0, 7).map(a => `<div class="check-row"><span>${esc(a.action)}</span><span class="hint">${esc(a.time)}</span></div>`).join('') || '<p class="hint">Belum ada aktivitas pada sesi SAHABAT MODE ini.</p>';
    }

    function teacherReport() {
      const years = options([['', 'Semua Tahun'], ...db.years.map(y => [y.id, y.name])], filters.reportYear || '');
      const periods = options([['', 'Semua Periode'], ...db.periods.map(p => [p.id, p.name])], filters.reportPeriod || '');
      const classes = options([['', 'Semua Kelas'], ...db.classes.map(c => [c.id, c.name])], filters.reportClass || '');
      const students = db.students.filter(s => teacherIds().includes(s.id) && (!filters.reportClass || s.classId === filters.reportClass));
      const done = s => db.schoolHabits.some(h => h.studentId === s.id && h.verified && (!filters.reportPeriod || h.periodId === filters.reportPeriod) && (!filters.reportYear || db.periods.find(p => p.id === h.periodId)?.yearId === filters.reportYear));

      return heading('LAPORAN', 'Laporan Pembinaan', 'Monitoring pengisian siswa berdasarkan sumber data pusat.') +
        `<section class="card mt-4">
          <div class="toolbar">
            <label class="field">Tahun Ajaran<select id="report-year">${years}</select></label>
            <label class="field">Periode<select id="report-period">${periods}</select></label>
            <label class="field">Kelas<select id="report-class">${classes}</select></label>
          </div>
          <div class="stats">
            <div class="card stat"><strong>${students.filter(done).length}</strong><small>Sudah Mengisi</small></div>

                    <td>${i + 1}</td>
                    <td><strong>${esc(s.name)}</strong></td>
                    <td>${esc(s.nis)}</td>
                    <td>${esc(db.classes.find(c => c.id === s.classId)?.name || '—')}</td>
                    <td><span class="pill ${done(s) ? '' : 'off'}">${done(s) ? 'Sudah Mengisi' : 'Belum Mengisi'}</span></td>
                    <td>${esc(p ? `${db.years.find(y => y.id === p.yearId)?.name || ''} / ${p.name}` : '—')}</td>
                  </tr>`;
                }).join('') || '<tr><td colspan="6">Tidak ada siswa untuk filter ini.</td></tr>'}
              </tbody>
            </table>
          </div>
        </section>`;

    function moduleBody() {
      if ((role === 'operator' && view === 'Dashboard') || ((role === 'guru' || role === 'parent') && view === 'Beranda')) return homeDashboard();

      if (role === 'operator') {
        if (entityMap[view]) return entityTable(entityMap[view]);
        if (view === 'Tahun Ajaran & Periode') return periodPage();
        if (view === 'Analytics / Recap Center') return analytics();
        if (view === 'Audit Log') return heading('MONITORING', 'Audit Log', 'Aktivitas penting pada sesi demo ini.') + `<section class="card mt-4">${auditPreview()}</section>`;
      }

      if (role === 'guru') {
        if (view === 'Kelas Saya & Siswa Saya') return heading('KELAS SAYA', 'Kelas Saya & Siswa Saya', actor.name) + `<section class="card mt-4"><h2>${esc(db.classes.find(c => c.id === actor.classId)?.name || '')}</h2>${db.students.filter(s => teacherIds().includes(s.id)).map(s => `<div class="check-row">${esc(s.name)} <span class="pill">${points(s.id)} EXP</span></div>`).join('')}</section>`;

    function filteredAnalytics() {
      const ids = db.students.filter(s => (!filters.analyticsClass || s.classId === filters.analyticsClass) && (!filters.analyticsStudent || s.id === filters.analyticsStudent)).map(s => s.id);
      const ps = db.periods.filter(p => (!filters.period || p.id === filters.period) && (!filters.year || p.yearId === filters.year)).map(p => p.id);
      const match = r => ids.includes(r.studentId) && ps.includes(r.periodId);
      return { ids, school: db.schoolHabits.filter(match), home: db.homeHabits.filter(match), exp: db.exp.filter(match), assess: db.assessments.filter(match) };
    }

    function drawCharts() {
      if (!window.Chart) return;
      if (role === 'operator' && view === 'Dashboard') {

        };
        make('operator-comparison', 'bar', ['Sekolah', 'Rumah'], [a.school.length ? Math.round(done(a.school) / a.school.length * 100) : 0, a.home.length ? Math.round(done(a.home) / a.home.length * 100) : 0], ['#219c91', '#ef9b15']);
        const att = a.school.filter(h => h.activity === 'Kehadiran'),
          attEl = document.getElementById('operator-attendance');
        if (attEl && att.length) attEl.textContent = `Hadir ${att.filter(h => h.status === 'Terlaksana').length} · Belum tercatat ${Math.max(0, a.ids.length - att.length)}`;
        const av = a.assess,
          character = document.getElementById('operator-character');
        if (character && av.length) character.textContent = `${av.length} penilaian tersimpan · Religiusitas ${average(av, 0)} · Kedisiplinan ${average(av, 1)} · Kemandirian ${average(av, 2)}`;
        make('character-chart', 'bar', ['Religiusitas', 'Kedisiplinan', 'Kemandirian'], [average(av, 0), average(av, 1), average(av, 2)], ['#219c91', '#40ab7c', '#58a7a0']);
        const homeDone = done(a.home),

        if (homeEl && a.home.length) homeEl.textContent = `Total aktivitas rumah ${a.home.length} · Selesai ${homeDone} · Belum selesai ${a.home.length - homeDone} · Penyelesaian ${Math.round(homeDone / a.home.length * 100)}%`;
        make('home-donut', 'doughnut', ['Aktivitas Selesai', 'Aktivitas Belum Selesai', 'Aktivitas Belum Tercatat'], [homeDone, Math.max(0, a.home.length - homeDone), 0], ['#219c91', '#ef9b15', '#9ca3af']);
        return;
      }
      let ids = role === 'parent' ? [selectedStudent] : role === 'guru' ? teacherIds() : db.students.map(s => s.id);
      let sch = db.schoolHabits.filter(h => ids.includes(h.studentId) && h.verified),
        home = db.homeHabits.filter(h => ids.includes(h.studentId) && h.verified),
        exp = db.exp.filter(e => ids.includes(e.studentId)),
        ass = db.assessments.filter(a => ids.includes(a.studentId));
      if (view === 'Analytics / Recap Center') {
        const a = filteredAnalytics();

        sch = a.school.filter(h => h.verified);
        home = a.home.filter(h => h.verified);
        exp = a.exp;
        ass = a.assess;
        const summary = document.getElementById('analytics-summary');
        if (summary) summary.innerHTML = `<div class="stats" style="margin-bottom:0">${[[ids.length, 'Siswa'], [sch.length, 'Sekolah'], [home.length, 'Rumah'], [exp.reduce((n, e) => n + e.amount, 0), 'EXP']].map(([v, l]) => `<div class="stat border rounded-xl"><strong>${v}</strong><small>${l}</small></div>`).join('')}</div>`;
        const details = document.getElementById('analytics-details');
        if (details) details.innerHTML = `<p class="hint">Religiusitas: ${average(ass, 0)} / 4 · Kedisiplinan: ${average(ass, 1)} / 4 · Kemandirian: ${average(ass, 2)} / 4 · Kehadiran: ${sch.filter(h => h.activity === 'Kehadiran').length} · Keterlaksanaan: ${Math.round(100 * (sch.length + home.length) / Math.max(1, a.school.length + a.home.length))}%</p>`;
      }
      Chart.defaults.font.family = 'DM Sans';
      Chart.defaults.color = '#567b74';
      const main = document.getElementById('main-chart');
      if (main) charts.push(new Chart(main, { type: 'bar', data: { labels: ['Religiusitas', 'Kedisiplinan', 'Kemandirian', 'Sekolah', 'Rumah', 'Kehadiran', 'EXP'], datasets: [{ label: 'Rekap demo', data: [0, 1, 2].map(i => Number(average(ass, i))).concat([sch.length, home.length, sch.filter(h => h.activity === 'Kehadiran').length, exp.reduce((n, e) => n + e.amount, 0)]), backgroundColor: ['#219c91', '#219c91', '#219c91', '#ef9b15', '#40ab7c', '#58a7a0', '#136d69'], borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } }));
      const trend = document.getElementById('trend-chart');
      if (trend) {
        const dates = Array.from({ length: 7 }, (_, i) => {
          const d = new Date();
          d.setDate(d.getDate() - 6 + i);
          return d.toISOString().slice(0, 10);
        });
        charts.push(new Chart(trend, { type: 'line', data: { labels: dates.map(d => d.slice(5)), datasets: [{ label: 'EXP harian', data: dates.map(d => exp.filter(e => e.date === d).reduce((n, e) => n + e.amount, 0)), borderColor: '#0b7b74', backgroundColor: '#b6e7d8', fill: true, tension: .3 }] }, options: { responsive: true, maintainAspectRatio: false } }));
      }
    }

    function average(a, i) {
      return a.length ? (a.reduce((n, x) => n + Number(x.scores[i]), 0) / a.length).toFixed(1) : '0.0';
    }

    function award(h, source) {
      if (h.status !== 'Terlaksana') return;
      const key = `${source}:${h.studentId}:${h.periodId}:${h.date}:${h.activity}`;
      if (db.exp.some(e => e.key === key)) return;
      const amount = weights[h.activity] || 5;
      const expObj = { id: uid(), key, studentId: h.studentId, periodId: h.periodId, date: h.date, activity: h.activity, source, amount };
      db.exp.push(expObj);
      
      // Simpan Poin EXP Baru ke Spreadsheet
      syncDataToSpreadsheet('addExp', expObj);
    }

    function verify(kind, id) {
      const h = (kind === 'school' ? db.schoolHabits : db.homeHabits).find(x => x.id === id);
      if (!h || h.verified || !teacherIds().includes(h.studentId)) return toast('Akses ditolak atau aktivitas sudah diverifikasi.', true);
      h.verified = true;
      award(h, kind);
      log('Verifikasi ' + h.activity + ' untuk ' + db.students.find(s => s.id === h.studentId)?.name);
      toast('Aktivitas diverifikasi; EXP diperbarui sekali.');
      render();
    }

    function saveEntity(form) {
      const { type, id } = modal,
        old = id ? db[type].find(x => x.id === id) : null,
        data = Object.fromEntries(new FormData(form));
      for (const k in data) data[k] = String(data[k]).trim();

      if (Object.entries(data).some(([k, x]) => !x && !['nip', 'password'].includes(k))) return toast('Lengkapi seluruh kolom wajib.', true);
      if (type === 'students') {
        if (db.students.some(x => x.id !== id && (x.nis === data.nis || x.nisn === data.nisn))) return toast('NIS atau NISN sudah digunakan.', true);
        if (!db.classes.some(c => c.id === data.classId)) return toast('Siswa harus terhubung ke kelas.', true);
      }
      if (type === 'teachers' && !data.username) return toast('Username Guru wajib diisi.', true);
      if (['teachers', 'parents'].includes(type) && db.users.some(u => u.username === data.username && u.refId !== id)) return toast('Username sudah digunakan oleh akun lain.', true);
      if (type === 'years' && db.years.some(y => y.id !== id && y.name === data.name)) return toast('Tahun ajaran sudah ada.', true);
      if (type === 'parents' && !old && !data.studentId) return toast('Orang tua harus terhubung ke anak.', true);
      if (type === 'links' && db.links.some(l => l.id !== id && l.parentId === data.parentId && l.studentId === data.studentId)) return toast('Relasi sudah ada.', true);

      if (type === 'teachers') {
        data.active = data.active !== 'false';
        if (!data.password) delete data.password;
        else {
          data.passwordConfigured = true;
          delete data.password;
        }
      }

      if (old) Object.assign(old, data);
      else {
        const obj = { ...data, id: uid(), active: true };
        db[type].push(obj);
        if (type === 'parents') {
          db.links.push({ id: uid(), parentId: obj.id, studentId: data.studentId });
          delete obj.studentId;
        }
      }

      if (type === 'teachers' || type === 'parents') {
        const record = db[type].find(x => x.id === (old?.id || db[type].at(-1).id));
        let u = db.users.find(u => u.refId === record.id);
        if (u) u.username = record.username;
        else db.users.push({ id: uid(), refId: record.id, username: record.username, role: type === 'parents' ? 'parent' : 'guru' });
      }

      // SINKRONISASI SEMUA ENTITAS DATA CENTER KE SPREADSHEET
      if (!old) {
        const actionMap = {
          students: 'addStudent',
          teachers: 'addTeacher',
          parents: 'addParent',
          classes: 'addClass',
          links: 'addLink',
          years: 'addYear',
          periods: 'addPeriod'
        };
        if (actionMap[type]) {
          syncDataToSpreadsheet(actionMap[type], db[type].at(-1));
        }
      }

      log((old ? 'Edit ' : 'Tambah ') + type);
      modal = null;
      toast('Data berhasil disimpan.');
      render();
    }

    // --- Event Listeners ---
    document.addEventListener('click', e => {
      const button = e.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action,
        [verb, type, id] = action.split(':');

      if (verb === 'enter') {
        role = type;
        actor = null;
        render();
        return;
      }
      if (action === 'back' || action === 'logout') {
        role = null;
        actor = null;
        view = '';
        modal = null;
        render();
        return;
      }
      if (action === 'toggle-nav') {
        document.getElementById('sidebar')?.classList.toggle('open');
        document.getElementById('backdrop')?.classList.toggle('open');
        return;
      }
      if (action === 'close-nav') {
        document.getElementById('sidebar')?.classList.remove('open');
        button.classList.remove('open');
        return;
      }
      if (verb === 'view') {
        view = type;
        filters = {};
        render();
        return;
      }
      if (action === 'close-modal') {
        modal = null;
        render();
        return;
      }
      if (action === 'clear-filter') {
        filters = {};
        render();
        return;
      }
      if (action === 'reset-op-filter') {
        filters.opYear = '';
        filters.opPeriod = '';
        filters.opClass = '';
        filters.opStudent = '';
        render();
        return;
      }
      if (['add', 'edit', 'detail', 'delete'].includes(verb)) {
        modal = { mode: verb, type, id };
        render();
        return;
      }
      if (verb === 'verify') {
        verify(type, id);
        return;
      }
      if (verb === 'activate') {
        db.periods.forEach(p => p.active = p.id === type);
        db.years.forEach(y => y.active = y.id === db.periods.find(p => p.id === type)?.yearId);
        log('Mengaktifkan periode ' + periodLabel());
        toast('Periode aktif diperbarui.');
        render();
        return;
      }
      if (verb === 'toggle') {
        const item = db[type].find(r => r.id === id);
        if (!item) return;
        item.active = !item.active;
        log(`${item.active ? 'Aktifkan' : 'Nonaktifkan'} ${type}: ${entityName(type, item)}`);
        toast('Status diperbarui.');
        render();
        return;
      }
      if (verb === 'confirm-delete') {
        const item = db[type].find(r => r.id === id);
        if (!item) return;

        // 1. Kirim perintah hapus ke Google Spreadsheet untuk semua jenis entitas
        syncDataToSpreadsheet('deleteData', { type: type, item: item });

        // 2. Hapus data dari tampilan lokal
        db[type] = db[type].filter(r => r.id !== id);
        if (type === 'students') db.links = db.links.filter(l => l.studentId !== id);
        if (type === 'parents') db.links = db.links.filter(l => l.parentId !== id);

        log('Hapus ' + type + ': ' + entityName(type, item));
        modal = null;
        toast('Data berhasil dihapus dari antarmuka & Google Sheets.');
        render();
      }
    });

target.push(habitObj);

award(habitObj, kind);

// Simpan Pembiasaan Sekolah / Rumah ke Spreadsheet
syncDataToSpreadsheet(kind === 'school' ? 'addSchoolHabit' : 'addHomeHabit', habitObj);

          // Simpan Pembiasaan Sekolah / Rumah ke Spreadsheet
          syncDataToSpreadsheet(kind === 'school' ? 'addSchoolHabit' : 'addHomeHabit', habitObj);
          count++;
        });
        if (!count) return toast('Aktivitas untuk anak dan tanggal tersebut sudah tercatat. EXP ganda dicegah.', true);
        log('Input ' + (kind === 'school' ? 'School Habit Check' : 'Habit Tracker Rumah') + ' · ' + count + ' aktivitas');
        toast(`${count} aktivitas tersimpan; menunggu verifikasi guru.`);
        render();
        return;
      }
      if (form.id === 'assessment-form') {
        const period = activePeriod(),
          data = new FormData(form);
        if (!period) return toast('Periode tidak aktif; input ditolak.', true);
        if (!teacherIds().includes(data.get('studentId')) || !data.get('date')) return toast('Siswa atau tanggal tidak valid.', true);
        
        const assessObj = {
          id: uid(),
          studentId: data.get('studentId'),
          periodId: period.id,
          date: data.get('date'),
          scores: [0, 1, 2].map(i => Number(data.get('score' + i))),
          note: data.get('note'),
          follow: data.get('follow')
        };
        db.assessments.push(assessObj);

        // Simpan Penilaian Karakter ke Spreadsheet
        syncDataToSpreadsheet('addAssessment', assessObj);

        log('Simpan Penilaian Karakter');
        toast('Penilaian tersimpan.');
        render();
        return;
      }
      if (form.id === 'message-form') {
        const text = document.getElementById('message-text').value.trim(),
          studentId = selectedStudent;
        if (!text || !availableIds().includes(studentId)) return toast('Isi pesan dan pilih anak yang terhubung.', true);
        const parentId = role === 'parent' ? actor.id : document.getElementById('message-recipient')?.value;
        const teacherId = role === 'guru' ? actor.id : (db.teachers.find(t => t.classId === db.students.find(s => s.id === studentId)?.classId && t.role === 'Wali Kelas')?.id);
        if (!parentId || !teacherId || !db.links.some(l => l.parentId === parentId && l.studentId === studentId)) return toast('Pengirim, penerima, dan relasi keluarga wajib valid.', true);
        db.messages.push({
          id: uid(),
          studentId,
          parentId,
          teacherId,
          senderId: actor.id,
          senderName: actor.name,
          text,
          date: new Date().toLocaleString('id-ID')
        });
        log('Mengirim pesan privat untuk ' + db.students.find(s => s.id === studentId)?.name);
        toast('Pesan terkirim dalam sesi demo.');
        render();
      }
    });

    // Inisialisasi memuat data dari Spreadsheet lalu render aplikasi
    loadDataFromSpreadsheet()
      .catch(err => console.warn("Menggunakan data lokal demo:", err))
      .finally(() => render());
</script>
</body>

</html>

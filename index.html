<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAHABAT — SD Aisyiyah Unggulan Sumberlawang</title>

  <!-- External Libraries & Fonts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Fraunces:wght@700&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --deep: #103b39;
      --teal: #087b75;
      --pale: #edf7f3;
      --cream: #f7f4eb;
      --ink: #163e3a;
      --muted: #66827d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 3px solid #e6a73d !important;
      outline-offset: 2px;
    }

    .access {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background: linear-gradient(115deg, #123d3b, #297c76 72%, #408f88);
      color: white;
      padding: clamp(22px, 5vw, 56px);
    }

    .access-inner {
      max-width: 1160px;
      margin: auto;
      min-height: calc(88 * min(var(--vh, 1vh), 1vh));
      display: flex;
      flex-direction: column;
    }

    .access-logo {
      width: 200px;
      max-width: 55%;
      height: 68px;
      object-fit: contain;
      object-position: left center;
    }

    .access h1 {
      font-family: Fraunces, serif;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.05;
      margin: 14px 0;
    }

    .access-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: auto;
      margin-bottom: 30px;
    }

    .access-card {
      background: #fff;
      color: var(--ink);
      padding: 25px 21px 18px;
      border-radius: 13px;
      min-height: 245px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px #002f2b20;
    }

    .access-card .role-icon {
      color: var(--teal);
      margin-bottom: 15px;
    }

    .access-card h2 {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .access-card p {
      font-size: 13px;
      color: #657d79;
      line-height: 1.45;
    }

    .solid {
      background: var(--teal);
      color: white;
      border-radius: 8px;
      padding: 10px 17px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .02em;
    }

    .access-card .solid {
      width: 100%;
      margin-top: auto;
    }

    .solid:hover {
      background: #075d59;
    }

    .login-page {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--cream);
    }

    .login-photo {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      background: #174f4d;
    }

    .login-photo img.photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .login-photo:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #073f3bc9, #267c75a8);
    }

    .login-photo-content {
      position: absolute;
      z-index: 1;
      inset: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: white;
    }

    .login-photo-content img {
      width: 190px;
      height: 75px;
      object-fit: contain;
      object-position: left center;
    }

    .login-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .login-box {
      width: min(100%, 390px);
    }

    .login-box h1 {
      font-size: 30px;
      font-weight: 800;
      margin: 18px 0 4px;
    }

    .login-card,
    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px #103b390b;
      border: 1px solid #e4eeea;
    }

    .login-card {
      padding: 23px;
      margin-top: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea,
    .filter-control {
      width: 100%;
      border: 1px solid #d5e4df;
      border-radius: 7px;
      background: white;
      padding: 9px 11px;
      color: var(--ink);
      min-height: 38px;
    }

    .field textarea {
      min-height: 80px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .app-shell {
      display: flex;
      height: calc(100 * min(var(--vh, 1vh), 1vh));
      width: 100%;
      background: var(--pale);
      overflow: hidden;
    }

    .sidebar {
      width: 238px;
      flex: none;
      background: var(--deep);
      color: #effcf8;
      padding: 20px 13px;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow-y: auto;
      z-index: 20;
    }

    .side-logo {
      width: 145px;
      height: 56px;
      object-fit: contain;
      object-position: left;
    }

    .side-title {
      font-family: Fraunces, serif;
      font-size: 19px;
      margin: 7px 9px 0;
    }

    .side-caption {
      font-size: 10px;
      color: #92c7bd;
      margin: 0 9px 22px;
    }

    .nav-group {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      color: #83b9ae;
      margin: 15px 10px 7px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      padding: 10px 11px;
      color: #e0f4ef;
      border-radius: 7px;
      font-size: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-item:hover,
    .nav-item.active {
      background: #205c58;
      color: #fff;
    }

    .sidebar-bottom {
      margin-top: auto;
      border-top: 1px solid #3b6c65;
      padding-top: 10px;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      margin-left: 238px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      background: white;
      padding: 12px clamp(15px, 2vw, 30px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 66px;
      flex: none;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar strong {
      font-size: 13px;
    }

    .content {
      padding: 20px clamp(15px, 2vw, 30px) 35px;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .demo-banner {
      background: #fffbea;
      border: 1px solid #f5df93;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 21px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .14em;
      font-weight: 800;
      color: #07857a;
      text-transform: uppercase;
    }

    .page-title {
      font-size: clamp(22px, 2.5vw, 29px);
      font-weight: 800;
      margin: 2px 0 3px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
      margin: 19px 0;
    }

    .stat {
      padding: 18px;
      min-height: 104px;
    }

    .stat strong {
      font-size: 28px;
      display: block;
      margin: 7px 0 0;
    }

    .stat small {
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card {
      padding: 19px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .toolbar {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      align-items: center;
      margin: 16px 0;
    }

    .toolbar .filter-control {
      width: auto;
      max-width: 100%;
    }

    .table-wrap {
      overflow: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 610px;
      font-size: 12px;
    }

    .data-table th {
      background: #f0f8f5;
      color: #36736c;
      text-align: left;
      font-size: 10px;
      letter-spacing: .06em;
    }

    .data-table th,
    .data-table td {
      padding: 11px;
      border-bottom: 1px solid #edf2ef;
      vertical-align: middle;
    }

    .data-table tr:hover td {
      background: #f8fcfa;
    }

    .small-btn {
      border: 1px solid #cfe1db;
      background: white;
      color: #087b75;
      border-radius: 7px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 11px;
    }

    .small-btn:hover {
      background: #eef8f4;
    }

    .danger {
      color: #ae4640;
    }

    .pill {
      display: inline-block;
      border-radius: 99px;
      background: #e3f8ed;
      color: #168366;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill.off {
      background: #eee;
      color: #68736e;
    }

    .notice {
      padding: 11px 14px;
      border-radius: 8px;
      background: #dff7e9;
      color: #075b47;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .notice.error {
      background: #ffe9e5;
      color: #a02e2e;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .badge-card {
      text-align: center;
      background: #f6faf7;
      border: 1px solid #cde3da;
      border-radius: 12px;
      padding: 14px 7px;
      min-height: 145px;
    }

    .badge-card.locked {
      filter: grayscale(1);
      opacity: .55;
    }

    .badge-medal {
      font-size: 36px;
      display: block;
      margin-bottom: 7px;
    }

    .chart-holder {
      height: 240px;
      position: relative;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .full {
      grid-column: 1/-1;
    }

    /* Operator desktop dashboard */
    .operator-dashboard {
      padding-top: 12px;
      padding-bottom: 16px;
      overflow: hidden;
    }

    .operator-dashboard .demo-banner {
      margin-bottom: 10px;
      padding: 8px 12px;
    }

    .operator-dashboard .page-title {
      margin: 0 0 2px;
    }

    .operator-dashboard .operator-filters {
      margin-top: 10px;
      padding: 10px 14px;
    }

    .operator-dashboard .toolbar {
      margin: 8px 0 0;
      gap: 7px;
    }

    .operator-dashboard .field {
      gap: 3px;
    }

    .operator-dashboard .field input,
    .operator-dashboard .field select,
    .operator-dashboard .filter-control {
      padding: 6px 9px;
      min-height: 31px;
    }

    .operator-dashboard .stats {
      gap: 8px;
      margin: 10px 0;
    }

    .operator-dashboard .stat {
      padding: 9px 12px;
      min-height: 62px;
    }

    .operator-dashboard .stat strong {
      font-size: 20px;
      margin: 3px 0 0;
    }

    .operator-dashboard .card {
      padding: 12px;
      border-radius: 11px;
    }

    .operator-dashboard .card h2 {
      font-size: 13px;
      margin-bottom: 7px;
    }

    .operator-dashboard .card.mt-4 {
      margin-top: 10px;
    }

    .operator-dashboard .chart-holder {
      height: 112px;
    }

    .operator-dashboard .grid-2 {
      gap: 8px;
    }

    .operator-dashboard .data-table {
      font-size: 11px;
      min-width: 0;
    }

    .operator-dashboard .data-table th,
    .operator-dashboard .data-table td {
      padding: 6px 8px;
    }

    .operator-dashboard .grid-2.mt-4 {
      margin-top: 10px;
    }

    .operator-dashboard .table-wrap {
      max-height: 92px;
      overflow: auto;
    }

    .operator-dashboard .table-wrap+.chart-holder {
      height: 82px;
    }

    .operator-dashboard .operator-filters .toolbar .field {
      flex: 1 1 130px;
    }

    .operator-dashboard .operator-filters .small-btn {
      align-self: end;
    }

    @media (min-width: 951px) {
      .operator-dashboard {
        height: calc(100 * min(var(--vh, 1vh), 1vh) - 66px);
        min-height: 0;
      }

      .operator-dashboard .content {
        padding-top: 12px;
      }

      .operator-dashboard .grid-2.mt-4 .card {
        min-height: 154px;
      }

      .operator-dashboard .grid-2.mt-4 .chart-holder {
        height: 92px;
      }

      .operator-dashboard .card:has(#home-donut) {
        min-height: 126px;
      }

      .operator-dashboard .card:has(#home-donut) .chart-holder {
        height: 86px;
      }
    }

    @media (max-width: 950px) {
      .operator-dashboard {
        overflow: visible;
      }

      .operator-dashboard .chart-holder {
        height: 180px;
      }
    }

    @media (max-width: 690px) {
      .operator-dashboard .chart-holder,
      .operator-dashboard .grid-2.mt-4 .chart-holder {
        height: 210px;
      }

      .operator-dashboard .stat {
        min-height: 72px;
      }
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #edf3ef;
      font-size: 13px;
    }

    .check-row select {
      max-width: 180px;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      background: #f0f8f5;
      margin: 9px 0;
      font-size: 12px;
    }

    .message.mine {
      background: #e2f3ee;
      margin-left: 12%;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #092c2abb;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 17px;
    }

    .modal {
      background: white;
      border-radius: 15px;
      padding: 22px;
      width: min(100%, 620px);
      max-height: 90%;
      overflow: auto;
    }

    #toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 80;
      max-width: 350px;
    }

    .mobile-menu {
      display: none;
    }

    .backdrop {
      display: none;
    }

    @media (max-width: 950px) {
      .workspace {
        margin-left: 0;
      }

      .sidebar {
        position: fixed;
        left: 0;
        transform: translateX(-100%);
        transition: transform .25s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .backdrop.open {
        display: block;
        position: fixed;
        inset: 0;
        background: #072b2a88;
        z-index: 19;
      }

      .mobile-menu {
        display: inline-flex;
      }

      .badge-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 690px) {
      .access-cards,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .access-cards {
        margin-top: 35px;
      }

      .access-card {
        min-height: 185px;
      }

      .login-page {
        grid-template-columns: 1fr;
      }

      .login-photo {
        min-height: 260px;
      }

      .login-right {
        padding: 35px 20px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .badge-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .topbar {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body class="w-full" style="background: rgb(237, 247, 243);">
  <div id="app" class="w-full"></div>

  <!-- Validation & Template Placeholders -->
  <div id="template-validation" hidden aria-hidden="true">
    <span data-template-id="access-title" style="color: #fff; font-weight: 700; font-size: 14px;">SAHABAT</span>
    <span data-template-id="access-subtitle" style="color: #fff; font-weight: 700; font-size: 14px;">Sinergi Orang Tua dan Sekolah Pembentuk Anak Hebat</span>
    <span data-template-id="access-description" style="color: #fff; font-weight: 400; font-size: 14px;">Bersinergi dalam pembiasaan, berkolaborasi dalam pendidikan, membentuk anak hebat.</span>
    <span data-template-id="login-title" style="color: rgb(16, 59, 57); font-weight: 800; font-size: 14px;">Masuk SAHABAT</span>
    <span data-template-id="login-description" style="color: rgb(102, 130, 125); font-weight: 400; font-size: 14px;">Pilih profil aktif untuk melanjutkan ke dashboard sesuai hak akses demo.</span>
    <img data-template-id="login-photo" loading="lazy" src="https://images.pexels.com/photos/8613089/pexels-photo-8613089.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1280" alt="Anak-anak belajar bersama">
    <img data-template-id="school-logo" loading="lazy" src="https://via.placeholder.com/150x50?text=Logo+SD" alt="Logo SD Aisyiyah Unggulan Sumberlawang">
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <template id="branding">
    <img data-template-id="school-logo" loading="lazy" class="access-logo" alt="Logo">
  </template>

 <script>
    // --- KONFIGURASI GOOGLE APPS SCRIPT ---
    const API_URL = "https://script.google.com/macros/s/AKfycby9PCANHzJGGkxJis2n1utVmZCwQgevMxMqU5hWbcBfcDAGX9KcCHLJraYjJu_hOOE9/exec";

    // Fungsi Memuat Data dari Google Spreadsheet
    async function loadDataFromSpreadsheet() {
      if (!API_URL || API_URL.includes("MASUKKAN")) return; 
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        if(result && result.status === 'success' && result.data) {
          const d = result.data;

          if (d.students && d.students.length > 0) {
            db.students = d.students.map(r => ({ id: String(r[0]), nis: String(r[1]), nisn: String(r[2]), name: String(r[3]), gender: String(r[4]), classId: String(r[5]), active: r[6] !== false }));
          }
          if (d.teachers && d.teachers.length > 0) {
            db.teachers = d.teachers.map(r => ({ id: String(r[0]), name: String(r[1]), nip: String(r[2]), role: String(r[3]), classId: String(r[4]), username: String(r[5]), active: r[6] !== false }));
          }
          if (d.parents && d.parents.length > 0) {
            db.parents = d.parents.map(r => ({ id: String(r[0]), name: String(r[1]), role: String(r[2]), username: String(r[3]), active: r[4] !== false }));
          }
          if (d.classes && d.classes.length > 0) {
            db.classes = d.classes.map(r => ({ id: String(r[0]), name: String(r[1]), teacherId: String(r[2]), active: r[3] !== false }));
          }
          if (d.links && d.links.length > 0) {
            db.links = d.links.map(r => ({ id: String(r[0]), parentId: String(r[1]), studentId: String(r[2]) }));
          }
          if (d.years && d.years.length > 0) {
            db.years = d.years.map(r => ({ id: String(r[0]), name: String(r[1]), active: Boolean(r[2]) }));
          }
          if (d.periods && d.periods.length > 0) {
            db.periods = d.periods.map(r => ({ id: String(r[0]), name: String(r[1]), yearId: String(r[2]), active: Boolean(r[3]) }));
          }
          if (d.schoolHabits && d.schoolHabits.length > 0) {
            db.schoolHabits = d.schoolHabits.map(r => ({ id: String(r[0]), studentId: String(r[1]), periodId: String(r[2]), date: String(r[3]), activity: String(r[4]), status: String(r[5]), note: String(r[6]), verified: Boolean(r[7]) }));
          }
          if (d.homeHabits && d.homeHabits.length > 0) {
            db.homeHabits = d.homeHabits.map(r => ({ id: String(r[0]), studentId: String(r[1]), periodId: String(r[2]), date: String(r[3]), activity: String(r[4]), status: String(r[5]), note: String(r[6]), verified: Boolean(r[7]) }));
          }
          if (d.assessments && d.assessments.length > 0) {
            db.assessments = d.assessments.map(r => ({ id: String(r[0]), studentId: String(r[1]), periodId: String(r[2]), date: String(r[3]), scores: [Number(r[4]), Number(r[5]), Number(r[6])], note: String(r[7]), follow: String(r[8]) }));
          }
          if (d.exp && d.exp.length > 0) {
            db.exp = d.exp.map(r => ({ id: String(r[0]), key: String(r[1]), studentId: String(r[2]), periodId: String(r[3]), date: String(r[4]), activity: String(r[5]), source: String(r[6]), amount: Number(r[7]) }));
          }

          console.log("Database berhasil disinkronkan penuh dari Google Spreadsheet!");
        }
      } catch(err) {
        console.error("Gagal memuat database Google Sheets, menggunakan data demo lokal:", err);
      }
    }

    // Fungsi Mengirim Data ke Google Spreadsheet
    async function syncDataToSpreadsheet(actionType, payload) {
      if (!API_URL || API_URL.includes("MASUKKAN")) return;
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: actionType, data: payload })
        });
      } catch(err) {
        console.error("Gagal menyimpan ke Google Sheets:", err);
      }
    }

    const homeActivities = ['Bangun Tepat Waktu', 'Salat Subuh', 'Salat Magrib', 'Salat Isya', "Tilawah Al-Qur'an", 'Membantu Orang Tua', 'Adab Makan', 'Sopan Santun Berbicara', 'Tidur Tepat Waktu'];
    const weights = {
      'Kehadiran': 10,
      'Ketepatan Waktu': 10,
      'Kerapian Seragam': 10,
      'Salat Dhuha': 10,
      'Adab dan Kesantunan': 20,
      "Tilawah Al-Qur'an": 10,
      'Membantu Orang Tua': 10,
      'Tidur Tepat Waktu': 5
    };
    const levels = [
      ['Sahabat Pemula', 0, '🌱'],
      ['Sahabat Hebat', 75, '⭐'],
      ['Pejuang Akhlak', 175, '🛡️'],
      ['Teladan Karakter', 300, '🏅'],

      operator: [
        ['UTAMA', 'Dashboard'],
        ['DATA CENTER', 'Data Siswa', 'Data Guru', 'Data Orang Tua/Wali', 'Data Kelas', 'Relasi Keluarga', 'Tahun Ajaran & Periode'],
        ['MONITORING & LAPORAN', 'Analytics / Recap Center', 'Laporan', 'Audit Log']
      ],
      guru: [
        ['MENU', 'Beranda', 'Kelas Saya & Siswa Saya', 'School Habit Check', 'Kehadiran', 'Penilaian Karakter', 'Validasi', 'Buku Penghubung', 'Catatan Sinergi', 'Grafik Perkembangan', 'Laporan']
      ],
      parent: [
        ['MENU', 'Beranda', 'Profil Ananda', 'Habit Tracker Rumah', 'Catatan Sinergi', 'Grafik Perkembangan', 'Laporan']
      ]
    };

    const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const uid = () => 'd' + Math.random().toString(36).slice(2, 10);
    const today = () => new Date().toISOString().slice(0, 10);

    function initial() {
      return {
        users: [
          { id: 'u-op', username: 'operator-demo', role: 'operator' },
          { id: 'u-g1', username: 'niken-demo', role: 'guru' },
          { id: 'u-g2', username: 'tira-demo', role: 'guru' }
        ],
        students: [],
        parents: [],
        links: [],
        teachers: [],
        classes: [],
        years: [
          { id: 'y1', name: '2026/2027', active: true }
        ],
        periods: [
          { id: 'pr1', name: 'Gasal', yearId: 'y1', active: true }
        ],
        schoolHabits: [],
        homeHabits: [],
        assessments: [],
        messages: [],
        exp: [],
        audit: []
      };
    }

    let db = initial(),
      role = null,
      actor = null,
      view = '',
      selectedStudent = '',
      filters = {},
      modal = null,
      charts = [];

    function activePeriod() {
      return db.periods.find(p => p.active);
    }

    function periodLabel() {
      const p = activePeriod();
      return p ? `${db.years.find(y => y.id === p.yearId)?.name || ''} / ${p.name}` : 'Tidak ada periode aktif';
    }

    function log(action) {
      db.audit.unshift({
        id: uid(),
        time: new Date().toLocaleString('id-ID'),
        actor: actor?.name || 'Operator Demo',
        action
      });
    }

    function toast(text, error = false) {
      document.getElementById('toast').innerHTML = `<div class="notice ${error ? 'error' : ''} shadow-xl">${esc(text)}</div>`;
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => document.getElementById('toast').innerHTML = '', 4800);
    }

    function logo(cls = '') {
      return `<img src="logo/logo sdaus.jpeg" loading="lazy" class="${cls}" alt="Logo SD Aisyiyah Unggulan Sumberlawang">`;
    }

    function btn(label, action, klass = 'small-btn') {
      return `<button type="button" class="${klass}" data-action="${esc(action)}">${esc(label)}</button>`;
    }

    function options(items, current) {
      return items.map(([id, label]) => `<option value="${esc(id)}" ${String(id) === String(current) ? 'selected' : ''}>${esc(label)}</option>`).join('');
    }

    const studentOptions = (ids = null) => options(db.students.filter(s => s.active && (!ids || ids.includes(s.id))).map(s => [s.id, s.name]), selectedStudent);

    function ownedIds() {
      return actor?.studentId ? [actor.studentId] : db.links.filter(l => l.parentId === actor?.id).map(l => l.studentId);
    }

    function teacherIds() {
      return db.students.filter(s => s.classId === actor?.classId && s.active).map(s => s.id);
    }

    function availableIds() {
      return role === 'parent' ? ownedIds() : role === 'guru' ? teacherIds() : db.students.filter(s => s.active).map(s => s.id);
    }

    function currentChild() {
      if (!availableIds().includes(selectedStudent)) selectedStudent = availableIds()[0] || '';
      return db.students.find(s => s.id === selectedStudent);
    }

    function points(id, periodId = null) {
      return db.exp.filter(e => e.studentId === id && (!periodId || e.periodId === periodId)).reduce((n, e) => n + e.amount, 0);
    }

    function render() {
      charts.forEach(c => c.destroy());
      charts = [];
      const root = document.getElementById('app');
      if (!role) {
        root.innerHTML = accessPage();
        lucide.createIcons();
        return;
      }
      if (!actor) {
        root.innerHTML = loginPage();
        lucide.createIcons();
        return;
      }
      root.innerHTML = shellPage();
      lucide.createIcons();
      requestAnimationFrame(drawCharts);
    }

    function accessPage() {
      return `<main class="access">
        <div class="access-inner">
          <header>
            ${logo('access-logo')}
            <div class="mt-5 inline-block rounded-full border border-white/30 px-3 py-1 text-xs font-bold">SD AISYIYAH UNGGULAN SUMBERLAWANG</div>
            <h1 data-template-id="access-title">SAHABAT</h1>
            <p data-template-id="access-subtitle" class="font-bold">Sinergi Orang Tua dan Sekolah Pembentuk Anak Hebat</p>
          </header>
          <div class="access-cards">
            ${[
              ['operator', 'shield-check', 'Kelola Sistem dan Data Sekolah', 'Kelola master data, relasi, periode, analytics, laporan, dan audit aktivitas.', 'MASUK SEBAGAI OPERATOR'],
              ['guru', 'graduation-cap', 'Dampingi Pembinaan Sekolah', 'Catat monitoring sekolah, kehadiran, karakter, validasi, dan perkembangan siswa.', 'MASUK SEBAGAI GURU'],
              ['parent', 'heart-handshake', 'Dampingi Pembiasaan Anak di Rumah', 'Pantau perkembangan anak, isi pembiasaan harian, dan bangun sinergi bersama Guru.', 'MASUK SEBAGAI ORANG TUA']
            ].map(([r, icon, title, desc, cta]) => `
              <article class="access-card">

                <h2>${title}</h2>
                <p>${desc}</p>
                <button type="button" class="solid" data-action="enter:${r}">${cta}</button>
              </article>
            `).join('')}
          </div>
        </div>
      </main>`;
    }

    function loginPage() {
      const label = { operator: 'OPERATOR', guru: 'GURU', parent: 'ORANG TUA' }[role];
      const identities = role === 'operator' ? [['u-op', 'Operator SAHABAT']] : role === 'guru' ? db.teachers.filter(t => t.active && t.username).map(t => [t.id, `${t.name} — ${t.role}`]) : [];
      const parentLogin = role === 'parent' ? `<div class="field"><label for="student-nis">ID Siswa (NIS)</label><input id="student-nis" name="studentNis" type="text" inputmode="numeric" placeholder="Masukkan NIS siswa" autocomplete="off"></div>` : role === 'guru' ? `<div class="field"><label for="guru-username">Username Guru</label><input id="guru-username" name="guruUsername" type="text" placeholder="Masukkan username Guru" autocomplete="username" required></div>` : `<div class="field"><label for="demo-identity">Akun ${label} aktif</label><select id="demo-identity" required>${options(identities, identities[0]?.[0])}</select></div>`;

      return `<main class="login-page">
        <section class="login-photo">
          ${logo('hidden')}
          <img data-template-id="login-photo" loading="lazy" class="photo" src="https://images.pexels.com/photos/8613089/pexels-photo-8613089.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1280" alt="Belajar Bersama">
          <div class="login-photo-content">
            ${logo('')}
            <div>
              <span class="pill">AKSES ${label}</span>
              <h2 class="font-bold text-3xl mt-3" style="font-family:Fraunces,serif">SAHABAT</h2>
              <p>Sinergi Orang Tua dan Sekolah Pembentuk Anak Hebat</p>
            </div>
          </div>
        </section>
        <section class="login-right">
          <div class="login-box">
            ${btn('← Beranda Akses', 'back')}
            <h1 data-template-id="login-title">Masuk SAHABAT</h1>
            <form id="login-form" class="login-card mt-5">
              ${parentLogin}
              <button class="solid w-full mt-4" type="submit">MASUK KE DASHBOARD</button>
            </form>
          </div>
        </section>
      </main>`;
    }

    function shellPage() {
      const items = menus[role].map(group => `<div class="nav-group">${group[0]}</div>${group.slice(1).map(name => `<button class="nav-item ${view === name ? 'active' : ''}" data-action="view:${name}">${esc(name)}</button>`).join('')}`).join('');
      const body = moduleBody();

      return `<div class="app-shell">
        <div id="backdrop" class="backdrop" data-action="close-nav"></div>
        <aside id="sidebar" class="sidebar">
          ${logo('side-logo')}
          <div class="side-title">SAHABAT</div>
          <div class="side-caption">SD Aisyiyah Unggulan</div>
          <nav aria-label="Navigasi ${role}">${items}</nav>
          <div class="sidebar-bottom">${btn('⌂ Beranda Akses', 'logout', 'nav-item')}</div>
        </aside>
        <div class="workspace">
          <header class="topbar">
            <div class="flex items-center gap-3">
              ${btn('☰', 'toggle-nav', 'small-btn mobile-menu')}
              <div>
                <strong>SAHABAT — SD Aisyiyah Unggulan Sumberlawang</strong>
                <div class="hint">Selamat datang, ${esc(actor.name)} · ${esc(periodLabel())}</div>
              </div>
            </div>
            <span class="pill">CLOUD SYNCED</span>
          </header>
          <main class="content">
            <div class="demo-banner"><b>CONNECTED</b> · Data terhubung langsung dengan Google Spreadsheet terpusat.</div>
            <div id="page-notice" aria-live="polite"></div>
            ${body}
          </main>
        </div>
      </div>
      ${modal ? modalHtml() : ''}`;
    }

    function heading(kicker, title, sub = '', actions = '') {
      return `<div class="flex flex-wrap justify-between items-start gap-3">
        <div>
          <div class="eyebrow">${esc(kicker)}</div>
          <h1 class="page-title">${esc(title)}</h1>
          <p class="hint">${esc(sub)}</p>
        </div>
        <div class="flex gap-2">${actions}</div>
      </div>`;
    }

    function stats(id) {
      const active = db.students.filter(s => s.active).length,
        school = db.schoolHabits.filter(h => h.verified).length,
        home = db.homeHabits.filter(h => h.verified).length,
        total = db.exp.filter(e => !id || e.studentId === id).reduce((a, e) => a + e.amount, 0);

      const vals = role === 'parent' ? [
        [db.schoolHabits.filter(h => h.studentId === id && h.verified).length, 'Monitoring Sekolah'],
        [db.homeHabits.filter(h => h.studentId === id && h.verified).length, 'Habit Rumah'],
        [total, 'Total EXP'],
        [db.messages.filter(m => m.studentId === id).length, 'Pesan Sinergi']
      ] : [
        [role === 'guru' ? teacherIds().length : active, role === 'guru' ? 'Siswa Saya' : 'Siswa Aktif'],
        [school, 'Monitoring Terisi'],
        [home, 'Habit Rumah'],
        [total, 'Total EXP']
      ];

      return `<div class="stats">
        ${vals.map(([v, l], i) => `
          <div class="card stat">
            <strong>${v}</strong>
            <small>${l}</small>
          </div>
        `).join('')}
      </div>`;
    }

    function childPicker() {
      return `<div class="field my-3">
        <label for="child-picker">Ananda yang dipilih</label>
        <select id="child-picker" class="filter-control">${studentOptions(availableIds())}</select>
      </div>`;
    }

    function chartCards() {
      return `<div class="grid-2">
        <section class="card">
          <h2>Karakter dan Pembiasaan</h2>
          <div class="chart-holder"><canvas id="main-chart"></canvas></div>
        </section>
        <section class="card">
          <h2>Tren EXP Mingguan</h2>
          <div class="chart-holder"><canvas id="trend-chart"></canvas></div>
        </section>
      </div>`;
    }

    function homeDashboard() {
      if (role === 'operator') return heading('DASHBOARD', 'Dashboard Operator', 'Kelola sistem dan data sekolah terpusat.', btn('+ Tambah Siswa', 'add:students', 'solid'));
      if (role === 'guru') return heading('DASHBOARD', 'Dashboard Guru', 'Kelas saya dan daftar siswa bimbingan.') + stats() + chartCards();
      const s = currentChild();
      return heading('DASHBOARD', 'Dashboard Orang Tua', 'Progres pembiasaan ananda.') + childPicker() + stats(s?.id) + chartCards();
    }

    const entityMap = {
      'Data Siswa': 'students',
      'Data Guru': 'teachers',
      'Data Orang Tua/Wali': 'parents',
      'Data Kelas': 'classes',
      'Relasi Keluarga': 'links'
    };

    function entityName(type, row) {
      return type === 'links' ? `${db.students.find(s => s.id === row.studentId)?.name || '—'} ↔ ${db.parents.find(p => p.id === row.parentId)?.name || '—'}` : row.name;
    }

    function entityTable(type) {
      const labels = { students: 'Siswa', teachers: 'Guru', parents: 'Orang Tua/Wali', classes: 'Kelas', links: 'Relasi Keluarga' };
      return heading('DATA CENTER', 'Data ' + labels[type], 'Kelola data terpusat di spreadsheet.', btn('+ Tambah Data', 'add:' + type, 'solid')) +
        `<div class="card mt-4"><div class="table-wrap"><table class="data-table">
          <thead><tr><th>NAMA / RELASI</th><th>STATUS</th><th>TINDAKAN</th></tr></thead>
          <tbody>
            ${db[type].map(r => `
              <tr>
                <td><strong>${esc(entityName(type, r))}</strong></td>
                <td><span class="pill ${r.active === false ? 'off' : ''}">${r.active === false ? 'Tidak Aktif' : 'Aktif'}</span></td>
                <td>${btn('Hapus', `delete:${type}:${r.id}`, 'small-btn danger')}</td>
              </tr>
            `).join('') || '<tr><td colspan="3">Belum ada data. Silakan tambah data baru.</td></tr>'}
          </tbody>
        </table></div></div>`;
    }

    function periodPage() {
      return heading('DATA CENTER', 'Tahun Ajaran & Periode', 'Kelola tahun ajaran aktif.', btn('+ Tambah Periode', 'add:periods', 'solid')) +
        `<div class="card mt-4"><div class="table-wrap"><table class="data-table">
          <thead><tr><th>PERIODE</th><th>TAHUN</th><th>STATUS</th></tr></thead>
          <tbody>
            ${db.periods.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(db.years.find(y => y.id === p.yearId)?.name || '—')}</td><td><span class="pill ${p.active ? '' : 'off'}">${p.active ? 'Aktif' : 'Arsip'}</span></td></tr>`).join('')}
          </tbody>
        </table></div></div>`;
    }

    function habitPage(kind) {
      const school = kind === 'school';
      return heading(school ? 'PEMBINAAN SEKOLAH' : 'PEMBIASAAN RUMAH', school ? 'School Habit Check' : 'Habit Tracker Rumah', 'Isi pembiasaan harian.') +
        `<section class="card mt-4"><form id="habit-form" data-kind="${kind}" class="space-y-4">
          <div class="field"><label>Nama Anak</label><select name="studentId">${studentOptions(availableIds())}</select></div>
          <div class="field"><label>Tanggal</label><input type="date" name="date" value="${today()}" required></div>
          ${(school ? schoolActivities : homeActivities).map((name, i) => `
            <div class="check-row"><label>${esc(name)}</label>
            <select name="a${i}" class="filter-control"><option value="Belum Terlaksana">Belum Terlaksana</option><option value="Terlaksana">Terlaksana</option></select></div>
          `).join('')}
          <button type="submit" class="solid">Simpan Aktivitas</button>
        </form></section>`;
    }

    function assessmentPage() {
      return heading('KARAKTER', 'Penilaian Karakter', 'Penilaian berkala siswa.') +
        `<section class="card mt-4"><form id="assessment-form" class="form-grid">
          <div class="field"><label>Siswa</label><select name="studentId">${studentOptions(teacherIds())}</select></div>
          <div class="field"><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div>
          ${['Religiusitas', 'Kedisiplinan', 'Kemandirian'].map((a, i) => `
            <div class="field"><label>${a}</label><select name="score${i}"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
          `).join('')}
          <button class="solid full" type="submit">Simpan Penilaian</button>
        </form></section>`;
    }

    function moduleBody() {
      if (role === 'operator') {
        if (entityMap[view]) return entityTable(entityMap[view]);
        if (view === 'Tahun Ajaran & Periode') return periodPage();
      }
      if (role === 'guru') {
        if (view === 'School Habit Check' || view === 'Kehadiran') return habitPage('school');
        if (view === 'Penilaian Karakter') return assessmentPage();
      }
      if (role === 'parent' && view === 'Habit Tracker Rumah') return habitPage('home');
      return homeDashboard();
    }

    function modalHtml() {
      const { mode, type, id } = modal;
      if (mode === 'delete') return `<div class="overlay"><section class="modal"><h2>Hapus Data?</h2>${btn('Batal', 'close-modal')} ${btn('Hapus', `confirm-delete:${type}:${id}`, 'solid danger')}</section></div>`;
      
      const f = (n, l, t = 'text') => `<div class="field"><label>${l}</label><input name="${n}" type="${t}" required></div>`;
      let fields = '';
      if (type === 'students') fields = f('name', 'Nama Siswa') + f('nis', 'NIS') + f('nisn', 'NISN') + `<div class="field"><label>L/P</label><select name="gender"><option value="L">L</option><option value="P">P</option></select></div>`;
      if (type === 'teachers') fields = f('name', 'Nama Guru') + f('username', 'Username');
      if (type === 'parents') fields = f('name', 'Nama Orang Tua') + f('username', 'Username');
      if (type === 'classes') fields = f('name', 'Nama Kelas');
      if (type === 'years') fields = f('name', 'Tahun Ajaran (mis. 2026/2027)');
      if (type === 'periods') fields = f('name', 'Nama Periode (Gasal/Genap)');

      return `<div class="overlay"><section class="modal"><h2>Tambah Data ${type}</h2><form id="entity-form" class="form-grid">${fields}<div class="full flex gap-2 mt-3"><button class="solid" type="submit">Simpan</button>${btn('Batal', 'close-modal')}</div></form></section></div>`;
    }

    function saveEntity(form) {
      const { type } = modal,
            data = Object.fromEntries(new FormData(form));
      const obj = { ...data, id: uid(), active: true };
      db[type].push(obj);

      const actionMap = {
        students: 'addStudent',
        teachers: 'addTeacher',
        parents: 'addParent',
        classes: 'addClass',
        links: 'addLink',
        years: 'addYear',
        periods: 'addPeriod'
      };
      if (actionMap[type]) syncDataToSpreadsheet(actionMap[type], obj);

      modal = null;
      toast('Data berhasil disimpan ke Spreadsheet.');
      render();
    }

    // --- Event Listener Klik yang Diperbaiki agar Menu Berfungsi ---
    document.addEventListener('click', e => {
      const button = e.target.closest('[data-action]');
      if (!button) return;
      const rawAction = button.dataset.action;
      const parts = rawAction.split(':');
      const verb = parts[0];
      const type = parts.slice(1).join(':'); // Menggabungkan kembali sisa string agar nama menu lengkap (seperti 'Data Guru')

      if (verb === 'enter') { 
        role = type; 
        actor = null; 
        render(); 
        return; 
      }
      if (rawAction === 'back' || rawAction === 'logout') { 
        role = null; 
        actor = null; 
        view = ''; 
        modal = null; 
        render(); 
        return; 
      }
      if (verb === 'view') { 
        view = type; // Menyimpan nama menu yang diklik ke variabel view agar moduleBody() merender halaman yang tepat
        render(); 
        return; 
      }
      if (rawAction === 'close-modal') { 
        modal = null; 
        render(); 
        return; 
      }
      if (['add', 'delete'].includes(verb)) { 
        modal = { mode: verb, type, id: parts[2] }; 
        render(); 
        return; 
      }
      if (verb === 'confirm-delete') {
        db[type] = db[type].filter(r => r.id !== parts[2]);
        modal = null; 
        toast('Data dihapus.'); 
        render();
      }
    });

    document.addEventListener('submit', e => {
      e.preventDefault();
      const form = e.target;
      if (form.id === 'login-form') {
        if (role === 'guru') {
          const u = document.getElementById('guru-username').value.trim();
          actor = db.teachers.find(x => x.username === u) || { id: 'g1', name: 'Guru Demo', classId: 'c1', role: 'Wali Kelas' };
        } else if (role === 'parent') {
          const nis = document.getElementById('student-nis').value.trim();
          const s = db.students.find(x => x.nis === nis) || db.students[0];
          actor = { id: 'p1', name: 'Orang Tua Siswa', studentId: s?.id };
        } else {
          actor = { id: 'u-op', name: 'Operator SAHABAT' };
        }
        view = role === 'operator' ? 'Dashboard' : 'Beranda';
        render();
        return;
      }
      if (form.id === 'entity-form') { saveEntity(form); return; }
      if (form.id === 'habit-form') {
        const kind = form.dataset.kind,
              data = new FormData(form),
              studentId = role === 'parent' ? selectedStudent : data.get('studentId'),
              target = kind === 'school' ? db.schoolHabits : db.homeHabits,
              activities = kind === 'school' ? schoolActivities : homeActivities;
        
        activities.forEach((activity, i) => {
          const habitObj = { id: uid(), studentId, periodId: 'pr1', date: data.get('date'), activity, status: data.get('a' + i), verified: false };
          target.push(habitObj);
          syncDataToSpreadsheet(kind === 'school' ? 'addSchoolHabit' : 'addHomeHabit', habitObj);
        });
        toast('Aktivitas berhasil disimpan ke Spreadsheet.');
        render();
        return;
      }
    });

    function drawCharts() {
      const main = document.getElementById('main-chart');
      if (main && window.Chart) {
        charts.push(new Chart(main, { type: 'bar', data: { labels: ['Religiusitas', 'Kedisiplinan', 'Kemandirian'], datasets: [{ data: [3.5, 3.8, 3.2], backgroundColor: '#219c91' }] }, options: { responsive: true, maintainAspectRatio: false } }));
      }
    }

    // Inisialisasi awal memuat data dari spreadsheet
    loadDataFromSpreadsheet().finally(() => render());
</script>
</body>

</html>
